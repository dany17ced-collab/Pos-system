<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de administrador</title>
<style>
:root{--bg:#1C1D21;--card:#232429;--line:#32343b;--tx:#F2F2F4;--mut:#9A9CA6;--rosa:#FF2E63;--azul:#3EC1FF;--ambar:#FFC93E;--verde:#3EFFB0;--rojo:#FF4D5E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:1000px;margin:0 auto;padding:16px 20px 60px}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button.p{background:var(--rosa);border-color:var(--rosa);font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{white-space:nowrap;border-radius:99px}.chip.on{background:var(--azul);color:#06222e;border-color:var(--azul);font-weight:600}
.tabs{display:flex;gap:6px;margin:6px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px;color:var(--mut)}
.tab.on{color:var(--tx);border-color:var(--rosa);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card b{display:block;font-size:26px;margin-top:4px}.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500}td.r,th.r{text-align:right}
details.card{margin-bottom:10px}summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600}
.sz{display:inline-block;min-width:74px;margin:4px 6px 0 0;padding:6px 10px;border-radius:10px;background:#2c2e35;text-align:center}
.s3{background:#5a4a12}.s1{background:#6a3410}.s0{background:#6a1a22}.sn{background:#8a0f1c}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff3;display:inline-block;vertical-align:middle}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row span.n{flex:1;min-width:120px}
#login{max-width:340px;margin:12vh auto;display:grid;gap:10px;padding:0 20px}
.err{color:var(--rojo)}.ok{color:var(--verde)}.hide{display:none!important}
.x{overflow-x:auto}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 20px}
header h1{font-size:17px;font-weight:700}
.scan{flex:2;max-width:380px}.scan input{width:100%}
.shell{display:flex;min-height:calc(100vh - 58px)}
.tabs{flex-direction:column;width:210px;flex:none;margin:0;border-bottom:0;border-right:1px solid var(--line);padding:12px 8px;gap:2px;position:sticky;top:58px;align-self:flex-start;height:calc(100vh - 58px);overflow:auto}
.tab{text-align:left;width:100%;border:0;border-left:3px solid transparent;border-radius:8px;padding:10px 12px}
.tab.on{background:var(--card);border-color:var(--rosa)}
main{flex:1;max-width:1300px;margin:0;padding:18px 28px 60px;min-width:0}
.grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
tr[data-vd]:hover td{background:#2a2c33}
hr{border:0;border-top:1px dashed #999;margin:6px 0}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.tk{background:#fff;color:#000;padding:12px;font:12px/1.35 monospace;max-width:300px;margin:0 auto 12px}
#ticket{display:none}
@media(max-width:800px){.shell{display:block}.tabs{flex-direction:row;width:auto;height:auto;position:static;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
 .tab{white-space:nowrap;width:auto;border-left:0;border-bottom:3px solid transparent}.tab.on{background:none;border-color:var(--rosa)}main{padding:14px}}
@media print{body>*{display:none!important}#ticket{display:block!important;color:#000;background:#fff;width:72mm;font:12px/1.35 monospace}@page{margin:3mm}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:99px;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #333;cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #333}
.sug{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}.sug button{aspect-ratio:1;padding:0;border-radius:8px;border:1px solid #fff2;cursor:pointer}
canvas[data-sw]{width:26px;height:26px;border-radius:50%;vertical-align:middle;border:2px solid #fff3}
canvas[data-mini],#pv{border-radius:50%}h4{margin:14px 0 6px;font-weight:600}
.sz{display:inline-flex;align-items:stretch;min-width:0;padding:0;overflow:hidden;margin:4px 8px 0 0;border-radius:12px;text-align:left;vertical-align:middle}
.sz .t{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#0003;font-weight:600;min-width:44px;justify-content:center}
.sz .q{padding:6px 14px;font-size:20px;font-weight:700;line-height:1.3}.sz .q small{font-size:12px;font-weight:400;color:var(--mut);margin-left:3px}
.tag{display:inline-flex;vertical-align:middle}
</style>
</head>
<body>
<section id="login">
  <h1>Panel de administrador</h1>
  <input id="em" type="email" placeholder="Correo" autocomplete="username">
  <input id="pw" type="password" placeholder="Clave" autocomplete="current-password">
  <button class="p" id="go">Entrar</button>
  <div id="msg" class="err"></div>
</section>
<div id="app" class="hide">
  <header><h1 id="who">Panel</h1><div class="scan"><input id="sc" placeholder="Escanear código de barras o SKU y Enter"></div><span class="mut" id="upd"></span><button id="out">Salir</button></header>
  <div class="shell"><nav class="tabs" id="tabs"></nav>
  <main><div class="chips" id="stores"></div><div id="view"></div></main></div>
</div>
<div id="ticket"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "S/ " + Number(n || 0).toLocaleString("es-PE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const claveColor = c => String(c || "").trim().toLowerCase();
const S = {stores: [], store: "all", tab: "resumen", org: null, date: new Date().toLocaleDateString("sv")};
const TABS = [["resumen", "Resumen"], ["ventas", "Ventas"], ["stock", "Stock"], ["productos", "Productos y precios"], ["entradas", "Entradas y salidas"], ["almacen", "Almacén"], ["reportes", "Reportes"], ["cortes", "Cortes de caja"], ["descuentos", "Descuentos"], ["clientes", "Clientes"], ["vendedores", "Vendedores"], ["colores", "Colores"]];

async function all(table, cols, f) {
  let out = [], i = 0;
  for (;;) {
    let q = sb.from(table).select(cols);
    if (f) q = f(q);
    const {data, error} = await q.range(i, i + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) return out;
    i += 1000;
  }
}
const byStore = q => S.store === "all" ? q : q.eq("store_id", S.store);
const storeName = id => (S.stores.find(s => s.id === id) || {}).name || "—";

async function entrar() {
  $("msg").textContent = "";
  const {data, error} = await sb.auth.signInWithPassword({email: $("em").value.trim(), password: $("pw").value});
  if (error) { $("msg").textContent = "Correo o clave incorrectos."; return; }
  const {data: p, error: e2} = await sb.from("user_profiles").select("role,org_id,display_name").eq("id", data.user.id).single();
  if (e2 || !p || p.role !== "admin") {
    await sb.auth.signOut();
    $("msg").textContent = "Esta cuenta no es de administrador.";
    return;
  }
  S.org = p.org_id;
  $("who").textContent = "Panel de " + (p.display_name || "administrador");
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  const {data: st} = await sb.from("stores").select("id,name,active").order("name");
  S.stores = (st || []).filter(s => s.active);
  pintarBase(); render();
}

function pintarBase() {
  $("stores").innerHTML = [["all", "Todas"], ...S.stores.map(s => [s.id, s.name])]
    .map(([id, n]) => `<button class="chip ${S.store === id ? "on" : ""}" data-s="${esc(id)}">${esc(n)}</button>`).join("");
  $("tabs").innerHTML = TABS.map(([k, n]) => `<button class="tab ${S.tab === k ? "on" : ""}" data-t="${k}">${n}</button>`).join("");
}

async function render() {
  const v = $("view");
  try {
    if (S.tab === "resumen") await vResumen(v);
    else if (S.tab === "ventas") await vVentas(v);
    else if (S.tab === "stock") await vStock(v);
    else if (S.tab === "entradas") await vEntradas(v);
    else if (S.tab === "almacen") await vAlmacen(v);
    else if (S.tab === "reportes") await vReportes(v);
    else if (S.tab === "cortes") await vCortes(v);
    else if (S.tab === "descuentos") await vDescuentos(v);
    else if (S.tab === "productos") await vProductos(v);
    else if (S.tab === "clientes") await vClientes(v);
    else if (S.tab === "vendedores") await vVendedores(v);
    else await vColores(v);
    $("upd").textContent = "Actualizado " + new Date().toLocaleTimeString("es-PE", {hour: "2-digit", minute: "2-digit"});
  } catch (e) { v.innerHTML = `<p class="err">No se pudo cargar: ${esc(e.message || e)}</p>`; }
}

async function vResumen(v) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const ventas = (await all("sales", "store_id,total,status,sold_at,cashier_auth_id", byStore)).filter(s => s.status === "COMPLETADA");
  const deHoy = ventas.filter(s => new Date(s.sold_at) >= hoy);
  const prods = (await all("products", "id,stock,base_product_id,active,deleted", byStore)).filter(p => p.active && !p.deleted);
  const padres = new Set(prods.filter(p => p.base_product_id).map(p => p.base_product_id));
  const bajo = prods.filter(p => !padres.has(p.id) && p.stock <= 3).length;
  const suma = a => a.reduce((t, s) => t + Number(s.total), 0);
  const c = (t, n) => `<div class="card"><span class="mut">${t}</span><b>${n}</b></div>`;
  v.innerHTML = `<div class="grid">${c("Ventas de hoy", money(suma(deHoy)))}${c("Transacciones de hoy", deHoy.length)}
    ${c("Ventas totales", money(suma(ventas)))}${c("Productos con stock bajo", bajo)}
    ${c("Vendedores con ventas hoy", new Set(deHoy.map(s => s.cashier_auth_id).filter(Boolean)).size)}</div>`;
}

async function vVentas(v) {
  v.innerHTML = `<p><input type="date" id="fd" value="${S.date}"></p><div id="vl">Cargando…</div>`;
  $("fd").onchange = e => { S.date = e.target.value; render(); };
  const ini = new Date(S.date + "T00:00:00"), fin = new Date(ini.getTime() + 864e5);
  const rows = await all("sales", "id,folio,store_id,sold_at,total,payment_method,receipt_type,status,origin",
    q => byStore(q).gte("sold_at", ini.toISOString()).lt("sold_at", fin.toISOString()).order("sold_at", {ascending: false}));
  const ok = rows.filter(r => r.status === "COMPLETADA");
  $("vl").innerHTML = `<p class="mut">Toca una venta para ver el detalle e imprimir una copia. ${ok.length} ventas · ${money(ok.reduce((t, r) => t + Number(r.total), 0))}</p>` +
    (rows.length ? `<div class="x"><table><tr><th>Hora</th><th>Tienda</th><th>Comprobante</th><th>Pago</th><th class="r">Total</th></tr>` +
    rows.map(r => `<tr data-vd="${esc(r.id)}" style="cursor:pointer"><td>${new Date(r.sold_at).toLocaleTimeString("es-PE", {hour: "2-digit", minute: "2-digit"})}</td>
      <td>${esc(storeName(r.store_id))}${r.origin === "ALMACEN" ? " (almacén)" : ""}</td>
      <td>${esc(r.receipt_type)} ${r.folio ?? ""}${r.status === "ANULADA" ? ' <span class="err">anulada</span>' : ""}</td>
      <td>${esc(r.payment_method)}</td><td class="r">${money(r.total)}</td></tr>`).join("") + "</table></div>"
    : "<p class='mut'>No hay ventas ese día.</p>");
}

let stockQ = "";
async function vStock(v) {
  const [prods, pal] = await Promise.all([
    all("products", "id,name,size,color_name,stock,base_product_id,active,deleted", byStore),
    all("color_palette", "name_key,hex")]);
  const hex = Object.fromEntries(pal.map(p => [p.name_key, p.hex]));
  const vivos = prods.filter(p => p.active && !p.deleted);
  const hijos = {}; vivos.filter(p => p.base_product_id).forEach(p => (hijos[p.base_product_id] ||= []).push(p));
  const items = vivos.filter(p => !p.base_product_id).map(p => ({p, h: hijos[p.id] || []}))
    .filter(x => x.p.name.toLowerCase().includes(stockQ.toLowerCase())).sort((a, b) => a.p.name.localeCompare(b.p.name));
  const cls = n => n < 0 ? "sn" : n === 0 ? "s0" : n === 1 ? "s1" : n <= 3 ? "s3" : "";
  v.innerHTML = `<p><input id="bq" placeholder="Buscar producto" value="${esc(stockQ)}" style="width:100%"></p><p class="mut">En cada recuadro, a la izquierda va la talla y a la derecha la cantidad de unidades.</p>` + items.map(({p, h}) => {
    if (!h.length) return `<div class="card" style="margin-bottom:10px"><b style="font-size:16px">${esc(p.name)}</b> <span class="sz ${cls(p.stock)}"><span class="q" title="Cantidad">${p.stock}<small>u.</small></span></span></div>`;
    const colores = {}; h.forEach(x => (colores[x.color_name || "Sin color"] ||= []).push(x));
    const total = h.reduce((t, x) => t + x.stock, 0);
    return `<details class="card"><summary><span>${esc(p.name)}</span><span>${total} u.</span></summary>` +
      Object.entries(colores).map(([c, xs]) => {
        const hx = hex[claveColor(c)] || "#888888";
        return `<div class="row"><canvas width="26" height="26" data-sw="${esc(hx)}"></canvas><span class="n">${esc(c)}</span></div><div>` +
          xs.sort((a, b) => String(a.size).localeCompare(String(b.size), "es", {numeric: true}))
            .map(x => `<span class="sz ${cls(x.stock)}"><span class="t" title="Talla">${esc(x.size || "—")}</span><span class="q" title="Cantidad">${x.stock}<small>u.</small></span></span>`).join("") + "</div>";
      }).join("") + "</details>";
  }).join("") || "<p class='mut'>Sin productos.</p>";
  pintarSw(v);
  const b = $("bq"); b.oninput = e => { stockQ = e.target.value; vStock(v); setTimeout(() => { const n = $("bq"); n.focus(); n.setSelectionRange(99, 99); }); };
}

const ESTILOS = [["liso","Liso",1,1],["bicolor","Bicolor",2,3],["diagonal","Diagonal",2,3],["rayas","Rayas playero",2,4],["rayasv","Rayas verticales",2,4],["rayasf","Rayas finas",2,3],["ajedrez","Ajedrez",2,3],["cuadros","Cuadros",2,3],["lunares","Lunares",2,3],["manchas","Dálmata",2,3],["jaspeado","Jaspeado",2,4],["degradado","Degradado",2,4],["sectores","Multicolor",2,6],["tiedye","Tie-dye",2,5],["camuflaje","Camuflaje",3,5],["leopardo","Animal print",2,3]];
const parseColor = h => { h = String(h || ""); const i = h.indexOf(":"); return i < 0 ? {e: "liso", c: [h || "#888888"]} : {e: h.slice(0, i), c: h.slice(i + 1).split(",")}; };
const fondoColor = h => { const {e, c} = parseColor(h); if (e === "liso" || c.length < 2) return c[0]; const n = c.length;
  return e === "degradado" ? `linear-gradient(135deg,${c.join(",")})` : `linear-gradient(${e === "rayasv" ? 90 : 45}deg,${c.map((x, k) => `${x} ${k * 100 / n}% ${(k + 1) * 100 / n}%`).join(",")})`; };
const inputsColor = c => c.map(x => `<input type="color" value="${x}" style="padding:2px;width:42px">`).join("");
function valorFila(row) {
  const e = row.querySelector("select").value, c = [...row.querySelectorAll("input[type=color]")].map(i => i.value.toUpperCase());
  return e === "liso" ? c[0] : e + ":" + c.join(",");
}
function ajustarFila(row) {
  const [, , mn, mx] = ESTILOS.find(x => x[0] === row.querySelector("select").value), box = row.querySelector(".cols");
  let ins = box.querySelectorAll("input"); const base = ins.length ? ins[ins.length - 1].value : "#888888";
  while (box.querySelectorAll("input").length < mn) box.insertAdjacentHTML("beforeend", inputsColor([base]));
  while (box.querySelectorAll("input").length > mx) box.lastElementChild.remove();
  row.querySelector(".sw").style.background = fondoColor(valorFila(row));
}
function hex2hsv(h) {
  const r = parseInt(h.slice(1, 3), 16) / 255, g = parseInt(h.slice(3, 5), 16) / 255, b = parseInt(h.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b); let H = 0;
  if (d) { H = (mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60; if (H < 0) H += 360; }
  return {h: H, s: mx ? d / mx : 0, v: mx};
}
function hsv2hex(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(Math.min(k, 4 - k, 1), 0); };
  return "#" + [f(5), f(3), f(1)].map(x => Math.round(x * 255).toString(16).padStart(2, "0")).join("").toUpperCase();
}
// Dibuja el color o estampado dentro de un círculo (misma idea que en la app).
function dib(cv, e, c) {
  const w = cv.width, x = cv.getContext("2d"), n = c.length, col = i => c[i % n]; let sd = 7;
  const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647, o = Math.max(1, n - 1);
  const dot = (px, py, r, f) => { x.fillStyle = f; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill(); };
  const band = (k, vert) => { for (let i = 0; i < k; i++) { x.fillStyle = col(i); vert ? x.fillRect(i * w / k, 0, w / k + 1, w) : x.fillRect(0, i * w / k, w, w / k + 1); } };
  x.clearRect(0, 0, w, w); x.save(); x.beginPath(); x.arc(w / 2, w / 2, w / 2, 0, 7); x.clip(); x.fillStyle = c[0]; x.fillRect(0, 0, w, w);
  switch (e) {
    case "bicolor": x.fillStyle = col(1); x.fillRect(w / 2, 0, w / 2, w); break;
    case "diagonal": x.fillStyle = col(1); x.beginPath(); x.moveTo(w, 0); x.lineTo(w, w); x.lineTo(0, w); x.fill(); break;
    case "rayas": band(6, false); break;
    case "rayasv": band(6, true); break;
    case "rayasf": band(14, false); break;
    case "ajedrez": for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { x.fillStyle = col((i + j) % 2); x.fillRect(i * w / 4, j * w / 4, w / 4 + 1, w / 4 + 1); } break;
    case "cuadros": x.globalAlpha = .55; for (let i = 0; i < 4; i++) { x.fillStyle = col(1); x.fillRect(i * w / 4 + w / 16, 0, w / 8, w); x.fillRect(0, i * w / 4 + w / 16, w, w / 8); } x.globalAlpha = 1; break;
    case "lunares": for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) dot((i + .5 + (j % 2) * .5) * w / 4, (j + .5) * w / 4, w * .07, col(1)); break;
    case "manchas": for (let i = 0; i < 14; i++) dot(rnd() * w, rnd() * w, w * (.04 + rnd() * .07), col(1)); break;
    case "jaspeado": for (let i = 0; i < 90; i++) dot(rnd() * w, rnd() * w, w * .025, col(1 + i % o)); break;
    case "degradado": { const g = x.createLinearGradient(0, 0, w, w); c.forEach((k, i) => g.addColorStop(n > 1 ? i / (n - 1) : 0, k)); x.fillStyle = g; x.fillRect(0, 0, w, w); break; }
    case "sectores": for (let i = 0; i < n; i++) { x.fillStyle = col(i); x.beginPath(); x.moveTo(w / 2, w / 2); x.arc(w / 2, w / 2, w, i * 6.2832 / n - 1.57, (i + 1) * 6.2832 / n - 1.57); x.fill(); } break;
    case "tiedye": for (let i = 6; i >= 0; i--) dot(w / 2, w / 2, w * (.12 + i * .1), col(i)); break;
    case "camuflaje": for (let i = 0; i < 16; i++) dot(rnd() * w, rnd() * w, w * (.12 + rnd() * .12), col(1 + i % o)); break;
    case "leopardo": for (let i = 0; i < 9; i++) { const px = rnd() * w, py = rnd() * w; dot(px, py, w * .09, col(1)); dot(px, py, w * .045, col(2)); } break;
  }
  x.restore();
}

let P = null;
const EXTRA = ["#1E2A47", "#F2B31B", "#2E9B6A", "#C23B3B", "#8A9A5B", "#D9D9D9"];
function abrirPicker(k, nombre, valor) {
  const q = parseColor(valor || "#888888"); P = {k, nombre, e: q.e, c: q.c.map(x => x.toUpperCase()), i: 0};

}
function pintarPicker() {
  const [, etq, mn, mx] = ESTILOS.find(x => x[0] === P.e);
  while (P.c.length < mn) P.c.push(P.c[P.c.length - 1]); while (P.c.length > mx) P.c.pop(); if (P.i >= P.c.length) P.i = 0;
  let sug = ""; for (let r = 0; r < 7; r++) for (let h = 0; h < 12; h++) { const c = hsv2hex(h * 30, [.25, .4, .6, .8, 1, 1, 1][r], [1, 1, 1, 1, 1, .78, .5][r]); sug += `<button data-pc="${c}" style="background:${c}" aria-label="${c}"></button>`; }
  for (let i = 0; i < 12; i++) { const c = hsv2hex(48, .12 + i * .03, 1 - i * .07); sug += `<button data-pc="${c}" style="background:${c}" aria-label="${c}"></button>`; }
  for (let i = 0; i < 12; i++) { const c = hsv2hex(0, 0, 1 - i / 11); sug += `<button data-pc="${c}" style="background:${c}" aria-label="${c}"></button>`; }
  $("pk").innerHTML = `<div style="display:flex;gap:14px;align-items:center"><canvas id="pv" width="90" height="90"></canvas><div><b id="ph" style="font-size:22px"></b><br><span class="mut">${esc(P.nombre)} · ${esc(etq)}</span></div></div>
    <h4>Estilo de la tela</h4><div class="chips">${ESTILOS.map(x => `<button class="chip ${x[0] === P.e ? "on" : ""}" data-pe="${x[0]}" style="display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:14px"><canvas width="36" height="36" data-mini="${x[0]}"></canvas>${x[1]}</button>`).join("")}</div>
    ${mx > 1 ? `<h4>Colores del estampado</h4><div class="row" id="ps">${P.c.map((c, i) => `<button data-ps="${i}" style="padding:3px;border-radius:50%;${i === P.i ? "border-color:var(--azul);border-width:3px" : ""}"><span class="sw" style="background:${c};display:block"></span></button>`).join("")}
      ${P.c.length < mx ? '<button data-pa="1">+ Color</button>' : ""}${P.c.length > mn ? '<button data-pm="1">− Color</button>' : ""}</div>` : ""}
    <h4>Tono</h4><input type="range" id="rh" min="0" max="360" style="background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)">
    <h4>Saturación</h4><input type="range" id="rs" min="0" max="100"><h4>Valor</h4><input type="range" id="rv" min="0" max="100">
    <h4>Código</h4><input id="px" maxlength="7" style="width:120px"><h4>Sugerencias</h4><div class="sug">${sug}</div>
    <p style="text-align:right"><button class="p" data-pg="1">Guardar</button></p>`;
  const upd = () => { P.c[P.i] = hsv2hex(+$("rh").value, $("rs").value / 100, $("rv").value / 100); refrescarVista(true); };
  ["rh", "rs", "rv"].forEach(id => $(id).oninput = upd);
  $("px").onchange = e => { const t = e.target.value.trim().toUpperCase(); if (/^#[0-9A-F]{6}$/.test(t)) { P.c[P.i] = t; refrescarVista(); } };
  refrescarVista();
}
function refrescarVista(desdeSlider) {
  const hx = P.c[P.i], {h, s, v} = hex2hsv(hx);
  dib($("pv"), P.e, P.c); $("ph").textContent = hx;
  document.querySelectorAll("[data-mini]").forEach(cv => { const m = ESTILOS.find(x => x[0] === cv.dataset.mini); dib(cv, cv.dataset.mini, [P.c[P.i], ...EXTRA].slice(0, Math.max(2, m[2]))); });
  document.querySelectorAll("#ps .sw").forEach((el, i) => el.style.background = P.c[i]);
  if (!desdeSlider) { $("rh").value = h; $("rs").value = s * 100; $("rv").value = v * 100; }
  const H = +$("rh").value, S2 = $("rs").value / 100, V = $("rv").value / 100;
  $("rs").style.background = `linear-gradient(90deg,${hsv2hex(H, 0, V)},${hsv2hex(H, 1, V)})`;
  $("rv").style.background = `linear-gradient(90deg,#000,${hsv2hex(H, S2, 1)})`;
  $("px").value = hx;
}

document.addEventListener("click", async e => {

  else if (t.closest("[data-ps]")) { P.i = +t.closest("[data-ps]").dataset.ps; pintarPicker(); }
  else if (t.dataset.pa) { P.c.push(P.c[P.c.length - 1]); P.i = P.c.length - 1; pintarPicker(); }
  else if (t.dataset.pm) { P.c.pop(); P.i = 0; pintarPicker(); }
  else if (t.dataset.pc) { P.c[P.i] = t.dataset.pc; refrescarVista(); }
  else if (t.dataset.pg) guardarColor();
  else if (t.dataset.ce) abrirPicker(t.dataset.ce, t.dataset.nom, t.dataset.val);
  else if (t.dataset.pr) { $("ticket").innerHTML = ULT; window.print(); }
  else if (t.closest("[data-vd]")) verVenta(t.closest("[data-vd]").dataset.vd);
  else if (t.dataset.s) { S.store = t.dataset.s; pintarBase(); render(); }
  else if (t.dataset.t) { S.tab = t.dataset.t; pintarBase(); render(); }
  else if (t.dataset.save) {
    const k = t.dataset.save, hx = valorFila(t.parentElement);
    const {error} = await sb.from("color_palette").upsert({id: `${S.org}:${k}`, name_key: k, hex: hx});
    if (error) alert("No se pudo guardar: " + error.message); else render();
  } else if (t.dataset.reg) {
    const row = t.parentElement, id = t.dataset.reg, tipo = row.querySelector("select").value, n = parseInt(row.querySelector("input[type=number]").value, 10);
    if (!n) { alert("Escribe una cantidad."); return; }
    const delta = tipo === "ENTRADA" ? Math.abs(n) : tipo === "SALIDA" ? -Math.abs(n) : n, mid = crypto.randomUUID();
    t.disabled = true;
    const {data: after, error} = await sb.rpc("apply_stock_movements", {p_product_id: id, p_movements: [{id: mid, delta}]});
    if (error) { alert("No se pudo registrar: " + error.message); t.disabled = false; return; }
    const {error: e2} = await sb.from("inventory_movements").insert({id: mid, store_id: row.dataset.store, product_id: id, movement_type: tipo, quantity: Math.abs(delta),
      stock_before: after - delta, stock_after: after, reason: row.querySelector("input[type=text]").value || "Registrado desde el panel web", moved_at: new Date().toISOString()});
    alert("Stock actualizado: ahora hay " + after + (e2 ? ". Aviso: no se guardó la línea del historial (" + e2.message + ")." : "."));
    cerrarModal(); render();
  } else if (t.dataset.dd) {
    if (!confirm("¿Eliminar este descuento?")) return;
    const {error} = await sb.from("discounts").update({deleted: true}).eq("id", t.dataset.dd);
    if (error) alert("No se pudo eliminar: " + error.message); else render();
  } else if (t.dataset.pt) {
    const val = parseFloat(t.parentElement.querySelector("input").value);
    if (!(val >= 0)) { alert("Precio no válido."); return; }
    const {error} = await sb.from("price_tiers").update({unit_price: val}).eq("id", t.dataset.pt);
    alert(error ? "No se pudo guardar: " + error.message : "Precio guardado.");
  } else if (t.dataset.pn) {
    const i = t.parentElement.querySelectorAll("input"), nombre = i[0].value.trim(), costo = parseFloat(i[1].value) || 0;
    if (!nombre) { alert("El nombre no puede quedar vacío."); return; }
    const {error} = await sb.from("products").update({name: nombre, purchase_price: costo}).eq("id", t.dataset.pn);
    alert(error ? "No se pudo guardar: " + error.message : "Guardado.");
  } else if (t.dataset.dc) {
    if (!confirm("¿Eliminar este cliente?")) return;
    const {error} = await sb.from("customers").update({deleted: true}).eq("id", t.dataset.dc);
    if (error) alert("No se pudo eliminar: " + error.message); else render();
  } else if (t.dataset.dv) {
    if (!confirm("¿Quitar el acceso de este vendedor a la nube?")) return;
    try { await fnVend({accion: "eliminar_cuenta", auth_id: t.dataset.dv}); render(); } catch (err) { alert("No se pudo quitar: " + err.message); }
  } else if (t.dataset.del) {
    const {error} = await sb.from("color_palette").delete().eq("id", `${S.org}:${t.dataset.del}`);
    if (error) alert("No se pudo quitar: " + error.message); else render();
  }
});
async function subirFoto(id, file) {
  const img = await createImageBitmap(file), k = Math.min(1, 1200 / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(ok => cv.toBlob(ok, "image/jpeg", 0.85)), ruta = `${S.org}/productos/${id}-${Date.now()}.jpg`;
  const up = await sb.storage.from("catalog-photos").upload(ruta, blob, {contentType: "image/jpeg"}); if (up.error) throw up.error;
  const url = sb.storage.from("catalog-photos").getPublicUrl(ruta).data.publicUrl;
  const {error} = await sb.from("products").update({photo_url: url}).eq("id", id); if (error) throw error;
}
function modal(html) {
  cerrarModal(); const m = document.createElement("div"); m.className = "modal"; m.id = "md";
  m.innerHTML = `<div class="box">${html}<p style="text-align:right"><button data-x="1">Cerrar</button></p></div>`; document.body.appendChild(m);
}
const cerrarModal = () => { const m = $("md"); if (m) m.remove(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

const TIPO = {BOLETA: "Boleta de venta", FACTURA: "Factura", NOTA_VENTA: "Nota de venta"};
let ULT = "";
function htmlTicket(v, it, c) {
  const L = (a, b) => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${a}</span><span>${b}</span></div>`;
  return `<div style="text-align:center"><b>${esc(c.store_name || storeName(v.store_id))}</b>${c.slogan ? "<br>" + esc(c.slogan) : ""}${c.tax_id ? "<br>RUC " + esc(c.tax_id) : ""}${c.address ? "<br>" + esc(c.address) : ""}${c.phone ? "<br>Tel. " + esc(c.phone) : ""}
    <br><b>*** COPIA ***</b><br>${esc(TIPO[v.receipt_type] || v.receipt_type)} ${esc(v.folio ?? "")}${v.status === "ANULADA" ? "<br><b>ANULADA</b>" : ""}</div><hr>
    ${new Date(v.sold_at).toLocaleString("es-PE")}${v.customer_name ? "<br>Cliente: " + esc(v.customer_name) : ""}<hr>` +
    it.map(x => `${esc(x.product_name)}` + L(`${x.quantity} x ${money(x.unit_price)}`, money(x.subtotal))).join("") + "<hr>" +
    (Number(v.discount) > 0 ? L("Descuento" + (v.discount_label ? " (" + esc(v.discount_label) + ")" : ""), "-" + money(v.discount)) : "") +
    `<b>${L("TOTAL", money(v.total))}</b>${L("Pago", esc(v.payment_method))}` +
    (v.amount_received != null ? L("Recibido", money(v.amount_received)) + L("Vuelto", money(v.change_amount)) : "") +
    `<hr><div style="text-align:center">${esc(c.footer || "")}${c.exchange_policy ? "<br>" + esc(c.exchange_policy) : ""}</div>`;
}
async function verVenta(id) {
  try {
    const {data: v, error} = await sb.from("sales").select("*").eq("id", id).single(); if (error) throw error;
    const [a, b] = await Promise.all([sb.from("sale_items").select("product_name,quantity,unit_price,subtotal").eq("sale_id", id),
      sb.from("store_settings").select("*").eq("store_id", v.store_id).maybeSingle()]);
    ULT = htmlTicket(v, a.data || [], b.data || {});
    modal(`<div class="tk">${ULT}</div><p><button class="p" data-pr="1">Imprimir copia</button> <span class="mut">Sale en la impresora que elijas (ticket de 80 mm o A4).</span></p>`);
  } catch (err) { alert("No se pudo abrir la venta: " + (err.message || err)); }
}
const filaMov = p => `<div class="row" data-store="${esc(p.store_id)}"><span class="n">${esc(p.name)} · ${esc(p.color_name || "sin color")}
  <span class="sz"><span class="t" title="Talla">${esc(p.size || "—")}</span><span class="q" title="Stock actual">${p.stock}<small>u.</small></span></span> <span class="mut">${esc(storeName(p.store_id))}</span></span>
  <select><option value="ENTRADA">Entrada</option><option value="SALIDA">Salida</option><option value="AJUSTE">Ajuste</option></select>
  <input type="number" step="1" placeholder="Cantidad" style="width:100px"><input type="text" placeholder="Motivo (opcional)" style="width:150px">
  <button class="p" data-reg="${esc(p.id)}">Registrar</button></div>`;
async function escanear(code) {
  code = String(code || "").trim();
  if (!/^[A-Za-z0-9._\-]{3,64}$/.test(code)) { alert("Código no válido: " + code); return; }
  const {data, error} = await sb.from("products").select("id,store_id,name,size,color_name,stock,base_product_id,active,deleted").or(`barcode.eq.${code},sku.eq.${code}`);
  if (error) { alert("No se pudo buscar: " + error.message); return; }
  let r = (data || []).filter(p => p.active && !p.deleted); const h = r.filter(p => p.base_product_id); if (h.length) r = h;
  if (S.store !== "all") r = r.filter(p => p.store_id === S.store);
  modal(r.length ? `<h3 style="margin-top:0">Código ${esc(code)}</h3>` + r.map(filaMov).join("") : `<p>No hay ningún producto con el código <b>${esc(code)}</b>${S.store === "all" ? "" : " en esta tienda"}.</p>`);
}
// Lector de código de barras (USB o Bluetooth en modo teclado): escribe muy rápido y termina con Enter.
let bufEsc = "", tEsc = 0;
document.addEventListener("keydown", e => {
  if ($("app").classList.contains("hide") || e.ctrlKey || e.altKey || e.metaKey) return;
  const el = document.activeElement;
  if (el && el.id === "sc") { if (e.key === "Enter") { e.preventDefault(); const c = el.value; el.value = ""; escanear(c); } return; }
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  const now = Date.now(); if (now - tEsc > 80) bufEsc = ""; tEsc = now;
  if (e.key === "Enter") { if (bufEsc.length >= 3) { e.preventDefault(); const c = bufEsc; bufEsc = ""; escanear(c); } bufEsc = ""; }
  else if (e.key.length === 1) bufEsc += e.key;
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.est) ajustarFila(t.closest(".row"));
  else if (t.dataset.foto && t.files[0]) {
    try { await subirFoto(t.dataset.foto, t.files[0]); alert("Foto guardada. Los teléfonos que ya tenían una foto propia de este producto conservan la suya."); render(); }
    catch (err) { alert("No se pudo subir la foto: " + (err.message || err)); }
  }
});
$("go").onclick = entrar; $("pw").onkeydown = e => { if (e.key === "Enter") entrar(); };
$("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
setInterval(() => { if (!$("app").classList.contains("hide") && (S.tab === "resumen" || S.tab === "ventas")) render(); }, 30000);
</script>
